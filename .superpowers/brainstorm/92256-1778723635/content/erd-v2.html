<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERD v2 — ax-homework-submission</title>
<style>
  body { background: #0f0f0f; color: #e5e5e5; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 24px; }
  h2 { color: #f5f5f5; margin-bottom: 4px; font-size: 18px; }
  .subtitle { color: #888; margin-bottom: 24px; font-size: 13px; }
  svg { width: 100%; }
  .field { font-size: 11px; font-family: monospace; }
  .pk { fill: #f59e0b; }
  .fk { fill: #f87171; }
  .regular { fill: #94a3b8; }
  .type-text { fill: #6b7280; }
  .relation-line { stroke: #4b5563; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; }
  .new-tag { fill: #c084fc; font-size: 9px; font-weight: bold; }
</style>
</head>
<body>
<h2>Entity Relationship Diagram — v2</h2>
<p class="subtitle">Includes: project management layer (charter · milestones · deliverables · deadline requests)</p>

<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">

  <!-- ══════════════ ORIGINAL TABLES ══════════════ -->

  <!-- USERS -->
  <g transform="translate(20, 60)">
    <rect width="195" height="157" fill="#1a1a1a" stroke="#4ade80" stroke-width="2" rx="8"/>
    <rect width="195" height="32" fill="#4ade80" rx="8"/>
    <rect y="20" width="195" height="12" fill="#4ade80"/>
    <text x="97" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">users</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="130" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="195" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field regular">email</text><text x="130" y="78" class="field type-text">text</text>
    <line x1="0" y1="86" x2="195" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field regular">name</text><text x="130" y="104" class="field type-text">text</text>
    <line x1="0" y1="112" x2="195" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">avatar_url</text><text x="130" y="130" class="field type-text">text</text>
    <line x1="0" y1="138" x2="195" y2="138" stroke="#222" stroke-width="1"/>
    <text x="10" y="154" class="field regular">created_at</text><text x="130" y="154" class="field type-text">timestamptz</text>
  </g>

  <!-- HOMEWORKS -->
  <g transform="translate(820, 60)">
    <rect width="220" height="157" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <rect width="220" height="32" fill="#f59e0b" rx="8"/>
    <rect y="20" width="220" height="12" fill="#f59e0b"/>
    <text x="110" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">homeworks</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="145" y="52" class="field type-text">serial PK</text>
    <line x1="0" y1="60" x2="220" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field regular">title</text><text x="145" y="78" class="field type-text">text</text>
    <line x1="0" y1="86" x2="220" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field regular">description</text><text x="145" y="104" class="field type-text">text (HTML)</text>
    <line x1="0" y1="112" x2="220" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">due_date</text><text x="145" y="130" class="field type-text">date</text>
    <line x1="0" y1="138" x2="220" y2="138" stroke="#222" stroke-width="1"/>
    <text x="10" y="154" class="field regular">created_at</text><text x="145" y="154" class="field type-text">timestamptz</text>
  </g>

  <!-- SUBMISSIONS -->
  <g transform="translate(440, 60)">
    <rect width="255" height="222" fill="#1a1a1a" stroke="#7dd3fc" stroke-width="2" rx="8"/>
    <rect width="255" height="32" fill="#7dd3fc" rx="8"/>
    <rect y="20" width="255" height="12" fill="#7dd3fc"/>
    <text x="127" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">submissions</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="170" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="255" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field fk">🔗 user_id</text><text x="170" y="78" class="field type-text">uuid FK</text>
    <line x1="0" y1="86" x2="255" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field fk">🔗 homework_id</text><text x="170" y="104" class="field type-text">int FK</text>
    <line x1="0" y1="112" x2="255" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">file_path / file_name</text><text x="170" y="130" class="field type-text">text</text>
    <line x1="0" y1="138" x2="255" y2="138" stroke="#222" stroke-width="1"/>
    <text x="10" y="156" class="field regular">status</text><text x="170" y="156" class="field type-text">enum</text>
    <line x1="0" y1="164" x2="255" y2="164" stroke="#222" stroke-width="1"/>
    <text x="10" y="182" class="field regular">attempt_number</text><text x="170" y="182" class="field type-text">int</text>
    <line x1="0" y1="190" x2="255" y2="190" stroke="#222" stroke-width="1"/>
    <text x="10" y="208" class="field regular">submitted_at</text><text x="170" y="208" class="field type-text">timestamptz</text>
  </g>

  <!-- COMMENTS -->
  <g transform="translate(480, 360)">
    <rect width="215" height="130" fill="#1a1a1a" stroke="#c084fc" stroke-width="2" rx="8"/>
    <rect width="215" height="32" fill="#c084fc" rx="8"/>
    <rect y="20" width="215" height="12" fill="#c084fc"/>
    <text x="107" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">comments</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="150" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="215" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field fk">🔗 submission_id</text><text x="150" y="78" class="field type-text">uuid FK</text>
    <line x1="0" y1="86" x2="215" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field regular">body</text><text x="150" y="104" class="field type-text">text</text>
    <line x1="0" y1="112" x2="215" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="126" class="field regular">created_at</text><text x="150" y="126" class="field type-text">timestamptz</text>
  </g>

  <!-- ══════════════ NEW TABLES ══════════════ -->

  <!-- PROJECT CHARTERS -->
  <g transform="translate(20, 310)">
    <rect width="210" height="200" fill="#1a1a2e" stroke="#818cf8" stroke-width="2" rx="8"/>
    <rect width="210" height="32" fill="#818cf8" rx="8"/>
    <rect y="20" width="210" height="12" fill="#818cf8"/>
    <text x="88" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">project_charters</text>
    <text x="158" y="21" class="new-tag">NEW</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="140" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="210" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field fk">🔗 user_id</text><text x="140" y="78" class="field type-text">uuid FK UNIQUE</text>
    <line x1="0" y1="86" x2="210" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field regular">project_name</text><text x="140" y="104" class="field type-text">text</text>
    <line x1="0" y1="112" x2="210" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">content</text><text x="140" y="130" class="field type-text">jsonb</text>
    <text x="10" y="143" class="field type-text" style="font-size:9px">(structured sections)</text>
    <line x1="0" y1="150" x2="210" y2="150" stroke="#222" stroke-width="1"/>
    <text x="10" y="168" class="field regular">updated_at</text><text x="140" y="168" class="field type-text">timestamptz</text>
    <line x1="0" y1="176" x2="210" y2="176" stroke="#222" stroke-width="1"/>
    <text x="10" y="194" class="field regular">created_at</text><text x="140" y="194" class="field type-text">timestamptz</text>
  </g>

  <!-- MILESTONES -->
  <g transform="translate(20, 590)">
    <rect width="240" height="240" fill="#1a2e1a" stroke="#34d399" stroke-width="2" rx="8"/>
    <rect width="240" height="32" fill="#34d399" rx="8"/>
    <rect y="20" width="240" height="12" fill="#34d399"/>
    <text x="95" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">milestones</text>
    <text x="197" y="21" class="new-tag" fill="#0f0f0f">NEW</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="165" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="240" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field fk">🔗 user_id</text><text x="165" y="78" class="field type-text">uuid FK</text>
    <line x1="0" y1="86" x2="240" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field regular">week_number</text><text x="165" y="104" class="field type-text">int</text>
    <line x1="0" y1="112" x2="240" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">title</text><text x="165" y="130" class="field type-text">text</text>
    <line x1="0" y1="138" x2="240" y2="138" stroke="#222" stroke-width="1"/>
    <text x="10" y="156" class="field regular">start_date / due_date</text><text x="165" y="156" class="field type-text">date</text>
    <line x1="0" y1="164" x2="240" y2="164" stroke="#222" stroke-width="1"/>
    <text x="10" y="182" class="field regular">status</text><text x="165" y="182" class="field type-text">enum</text>
    <text x="10" y="194" class="field type-text" style="font-size:9px">not_started|in_progress|completed|delayed</text>
    <line x1="0" y1="200" x2="240" y2="200" stroke="#222" stroke-width="1"/>
    <text x="10" y="218" class="field regular">is_manual_progress</text><text x="165" y="218" class="field type-text">boolean</text>
    <line x1="0" y1="226" x2="240" y2="226" stroke="#222" stroke-width="1"/>
    <text x="10" y="238" class="field regular">display_order</text><text x="165" y="238" class="field type-text">int</text>
  </g>

  <!-- MILESTONE DELIVERABLES -->
  <g transform="translate(320, 590)">
    <rect width="230" height="157" fill="#1a2e1a" stroke="#34d399" stroke-width="2" rx="8"/>
    <rect width="230" height="32" fill="#34d399" rx="8"/>
    <rect y="20" width="230" height="12" fill="#34d399"/>
    <text x="88" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">milestone_deliverables</text>
    <text x="185" y="21" class="new-tag" fill="#0f0f0f">NEW</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="160" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field fk">🔗 milestone_id</text><text x="160" y="78" class="field type-text">uuid FK</text>
    <line x1="0" y1="86" x2="230" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field regular">file_path / file_name</text><text x="160" y="104" class="field type-text">text</text>
    <line x1="0" y1="112" x2="230" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">uploaded_at</text><text x="160" y="130" class="field type-text">timestamptz</text>
    <line x1="0" y1="138" x2="230" y2="138" stroke="#222" stroke-width="1"/>
    <text x="10" y="154" class="field type-text" style="font-size:9px">→ completes the milestone on upload</text>
  </g>

  <!-- DEADLINE CHANGE REQUESTS -->
  <g transform="translate(620, 590)">
    <rect width="260" height="240" fill="#2e1a1a" stroke="#fb923c" stroke-width="2" rx="8"/>
    <rect width="260" height="32" fill="#fb923c" rx="8"/>
    <rect y="20" width="260" height="12" fill="#fb923c"/>
    <text x="103" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f0f0f">deadline_change_requests</text>
    <text x="215" y="21" class="new-tag" fill="#0f0f0f">NEW</text>
    <text x="10" y="52" class="field pk">🔑 id</text><text x="180" y="52" class="field type-text">uuid PK</text>
    <line x1="0" y1="60" x2="260" y2="60" stroke="#222" stroke-width="1"/>
    <text x="10" y="78" class="field fk">🔗 milestone_id</text><text x="180" y="78" class="field type-text">uuid FK</text>
    <line x1="0" y1="86" x2="260" y2="86" stroke="#222" stroke-width="1"/>
    <text x="10" y="104" class="field fk">🔗 user_id</text><text x="180" y="104" class="field type-text">uuid FK</text>
    <line x1="0" y1="112" x2="260" y2="112" stroke="#222" stroke-width="1"/>
    <text x="10" y="130" class="field regular">original_due_date</text><text x="180" y="130" class="field type-text">date</text>
    <line x1="0" y1="138" x2="260" y2="138" stroke="#222" stroke-width="1"/>
    <text x="10" y="156" class="field regular">requested_due_date</text><text x="180" y="156" class="field type-text">date</text>
    <line x1="0" y1="164" x2="260" y2="164" stroke="#222" stroke-width="1"/>
    <text x="10" y="182" class="field regular">reason</text><text x="180" y="182" class="field type-text">text</text>
    <line x1="0" y1="190" x2="260" y2="190" stroke="#222" stroke-width="1"/>
    <text x="10" y="208" class="field regular">status</text><text x="180" y="208" class="field type-text">enum</text>
    <text x="10" y="220" class="field type-text" style="font-size:9px">pending|approved|rejected</text>
    <line x1="0" y1="226" x2="260" y2="226" stroke="#222" stroke-width="1"/>
    <text x="10" y="238" class="field fk">🔗 reviewed_by / support_assignee</text>
  </g>

  <!-- ══════════════ RELATIONSHIP LINES ══════════════ -->
  <!-- users → submissions -->
  <line x1="215" y1="120" x2="440" y2="140" class="relation-line"/>
  <!-- homeworks → submissions -->
  <line x1="820" y1="130" x2="695" y2="140" class="relation-line"/>
  <!-- submissions → comments -->
  <line x1="567" y1="282" x2="567" y2="360" class="relation-line"/>
  <!-- users → project_charters -->
  <line x1="117" y1="217" x2="117" y2="310" class="relation-line"/>
  <!-- users → milestones -->
  <line x1="60" y1="217" x2="60" y2="590" class="relation-line"/>
  <!-- milestones → milestone_deliverables -->
  <line x1="260" y1="680" x2="320" y2="680" class="relation-line"/>
  <!-- milestones → deadline_change_requests -->
  <line x1="260" y1="700" x2="620" y2="700" class="relation-line"/>
  <!-- users → deadline_change_requests -->
  <line x1="215" y1="150" x2="750" y2="693" class="relation-line"/>

  <!-- ══════════════ LEGEND ══════════════ -->
  <g transform="translate(900, 580)">
    <rect width="185" height="130" fill="#1a1a1a" stroke="#333" rx="6"/>
    <text x="10" y="20" font-size="11" fill="#888" font-weight="600">Legend</text>
    <text x="10" y="40" font-size="11" fill="#f59e0b">🔑 Primary Key</text>
    <text x="10" y="58" font-size="11" fill="#f87171">🔗 Foreign Key</text>
    <text x="10" y="76" font-size="11" fill="#4ade80">Green border = original</text>
    <text x="10" y="94" font-size="11" fill="#818cf8">Purple/teal/orange = NEW</text>
    <text x="10" y="112" font-size="11" fill="#4b5563">--- 1:N relationship</text>
  </g>

  <!-- Status note -->
  <g transform="translate(900, 720)">
    <rect width="185" height="50" fill="#1a1a2e" stroke="#818cf8" stroke-dasharray="3,2" rx="6"/>
    <text x="10" y="18" font-size="10" fill="#818cf8" font-weight="600">milestone.status computed from:</text>
    <text x="10" y="32" font-size="10" fill="#6b7280">has deliverable → completed</text>
    <text x="10" y="44" font-size="10" fill="#6b7280">past due + none → delayed</text>
  </g>

</svg>
</body>
</html>
